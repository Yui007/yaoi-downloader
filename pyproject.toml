[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaoi-downloader"
version = "1.0.0"
description = "A manga downloader to download manga from https://yaoi.me/ — Typer CLI + PyQt6 GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "cryptography>=41",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10",
    "img2pdf>=0.5",
    "pypdf>=4",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
yaoi = "yaoi.cli.app:main"
yaoi-gui = "yaoi.gui.app:main"

[project.urls]
Homepage = "https://github.com/Yui007/yaoi-downloader"
Repository = "https://github.com/Yui007/yaoi-downloader"
Issues = "https://github.com/Yui007/yaoi-downloader/issues"

[tool.setuptools.packages.find]
include = ["yaoi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
